<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DocQA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com/3.4.13"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] },
            colors: {
              ink: {
                900: "#0b1120",
                800: "#0f172a",
                700: "#1e293b",
                600: "#273449",
                500: "#334155",
              },
              brand: { 400: "#818cf8", 500: "#6366f1", 600: "#4f46e5" },
            },
          },
        },
      };
    </script>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        background:
          radial-gradient(1100px 600px at 15% -10%, #1e293b, transparent),
          radial-gradient(900px 500px at 100% 0%, #312e81, transparent), #0b1120;
      }
      ::-webkit-scrollbar {
        width: 9px;
        height: 9px;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 999px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      /* Markdown answer styling */
      .md :is(p, ul, ol) {
        margin: 0.35rem 0;
      }
      .md ul {
        list-style: disc;
        padding-left: 1.25rem;
      }
      .md ol {
        list-style: decimal;
        padding-left: 1.25rem;
      }
      .md strong {
        color: #fff;
        font-weight: 600;
      }
      .md code {
        background: #0b1120;
        padding: 1px 5px;
        border-radius: 5px;
        font-size: 0.85em;
      }
      .md pre {
        margin: 0.5rem 0;
        border: 1px solid #334155;
        border-radius: 10px;
        overflow: auto;
      }
      .md pre code {
        display: block;
        padding: 0.75rem 0.9rem;
        background: #0b1120;
        font-size: 0.82em;
        line-height: 1.5;
      }
      .md table {
        border-collapse: collapse;
        margin: 0.5rem 0;
        width: 100%;
      }
      .md th,
      .md td {
        border: 1px solid #334155;
        padding: 4px 8px;
        text-align: left;
        font-size: 0.9em;
      }
      .md h1,
      .md h2,
      .md h3 {
        font-weight: 600;
        margin: 0.5rem 0 0.25rem;
      }
      .cursor::after {
        content: "▋";
        margin-left: 2px;
        color: #818cf8;
        animation: blink 1s steps(2, start) infinite;
      }
      @keyframes blink {
        to {
          visibility: hidden;
        }
      }
      .dot {
        animation: bounce 1.2s infinite;
      }
      .dot:nth-child(2) {
        animation-delay: 0.15s;
      }
      .dot:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
          opacity: 0.4;
        }
        40% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body class="font-sans text-slate-200 antialiased">
    <!-- ================= LOGIN ================= -->
    <section
      id="login-view"
      class="hidden min-h-screen items-center justify-center p-4"
    >
      <div
        class="w-full max-w-xl rounded-2xl border border-ink-500/60 bg-ink-800/70 p-8 shadow-2xl backdrop-blur"
      >
        <div class="mb-6 flex items-center gap-3">
          <div
            class="grid h-11 w-11 place-items-center rounded-xl bg-gradient-to-br from-brand-500 to-brand-600 text-xl"
          >
            📑
          </div>
          <div>
            <h1 class="text-xl font-semibold text-white">DocQA</h1>
          </div>
        </div>

        <p class="mb-4 text-sm text-slate-400">
          Sign in with a sample email and the demo password
          <code class="rounded bg-ink-700 px-1.5 py-0.5 text-brand-300">123456</code>.
          Each account sees only its authorised companies.
        </p>

        <form id="login-form" class="flex flex-col gap-2 sm:flex-row">
          <input
            id="email-input"
            type="email"
            placeholder="alice@email.com"
            autocomplete="username"
            class="flex-1 rounded-xl border border-ink-500 bg-ink-700 px-4 py-3 text-sm outline-none focus:border-brand-500"
          />
          <input
            id="password-input"
            type="password"
            placeholder="password"
            autocomplete="current-password"
            class="rounded-xl border border-ink-500 bg-ink-700 px-4 py-3 text-sm outline-none focus:border-brand-500 sm:w-40"
          />
          <button
            type="submit"
            class="rounded-xl bg-gradient-to-br from-brand-500 to-brand-600 px-5 py-3 text-sm font-semibold text-white hover:opacity-90"
          >
            Sign in
          </button>
        </form>
        <p id="login-error" class="mt-2 hidden text-sm text-rose-400"></p>

        <h2
          class="mb-2 mt-6 text-xs font-semibold uppercase tracking-wider text-slate-500"
        >
          Sample accounts — type an email above with password 123456
        </h2>
        <div id="user-list" class="space-y-2"></div>
      </div>
    </section>

    <!-- ================= CHAT ================= -->
    <section id="chat-view" class="hidden h-screen flex-col">
      <header
        class="flex items-center justify-between border-b border-ink-600/70 bg-ink-900/60 px-5 py-3 backdrop-blur"
      >
        <div class="flex items-center gap-2">
          <span class="text-lg">📑</span>
          <span class="font-semibold text-white">DocQA</span>
        </div>
        <div class="flex items-center gap-3">
          <div class="text-right leading-tight">
            <div id="who" class="text-sm font-semibold text-white"></div>
            <div id="who-email" class="text-xs text-slate-400"></div>
          </div>
          <button
            id="logout-btn"
            class="rounded-lg border border-ink-500 px-3 py-1.5 text-sm hover:border-brand-500"
          >
            Log out
          </button>
        </div>
      </header>

      <div class="mx-auto flex w-full max-w-6xl flex-1 gap-5 overflow-hidden p-5">
        <!-- Sidebar -->
        <aside
          class="hidden w-64 shrink-0 flex-col rounded-2xl border border-ink-600/70 bg-ink-800/50 p-4 md:flex"
        >
          <h2
            class="mb-1 text-xs font-semibold uppercase tracking-wider text-slate-500"
          >
            Your access
          </h2>
          <p class="mb-3 text-xs text-slate-400">
            You can only query these companies. Queries are isolated to your
            account.
          </p>
          <div id="company-pills" class="mb-5 flex flex-wrap gap-1.5"></div>

          <h2
            class="mb-2 text-xs font-semibold uppercase tracking-wider text-slate-500"
          >
            Try asking
          </h2>
          <div id="suggestions" class="mb-5 space-y-1.5"></div>

          <button
            id="clear-btn"
            class="mt-auto rounded-lg border border-ink-500 px-3 py-2 text-sm hover:border-brand-500"
          >
            Clear conversation
          </button>
        </aside>

        <!-- Conversation -->
        <main
          class="flex flex-1 flex-col overflow-hidden rounded-2xl border border-ink-600/70 bg-ink-800/40"
        >
          <div id="messages" class="flex-1 space-y-5 overflow-y-auto p-5"></div>

          <form
            id="composer"
            class="flex items-end gap-2 border-t border-ink-600/70 bg-ink-900/40 p-3"
          >
            <textarea
              id="question"
              rows="1"
              placeholder="Ask about your authorised documents…  (Enter to send, Shift+Enter for newline)"
              class="max-h-40 flex-1 resize-none rounded-xl border border-ink-500 bg-ink-700 px-4 py-3 text-sm outline-none focus:border-brand-500"
            ></textarea>
            <button
              id="send-btn"
              type="submit"
              class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-gradient-to-br from-brand-500 to-brand-600 text-white hover:opacity-90 disabled:opacity-40"
              title="Send"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path
                  d="M3 11l18-8-8 18-2-7-8-3z"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </form>
        </main>
      </div>
    </section>

    <script>
      marked.setOptions({ breaks: true, gfm: true });
      const render = (md) => DOMPurify.sanitize(marked.parse(md || ""));
      const highlightIn = (el) => {
        if (!window.hljs) return;
        el.querySelectorAll("pre code").forEach((b) => {
          try {
            hljs.highlightElement(b);
          } catch {}
        });
      };

      const SEND_ICON =
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 11l18-8-8 18-2-7-8-3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
      const STOP_ICON =
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>';

      const $ = (id) => document.getElementById(id);
      const state = { me: null, streaming: false, controller: null };

      // ---------- View switching ----------
      function showLogin() {
        $("login-view").classList.remove("hidden");
        $("login-view").classList.add("flex");
        $("chat-view").classList.add("hidden");
        $("chat-view").classList.remove("flex");
      }
      function showChat() {
        $("chat-view").classList.remove("hidden");
        $("chat-view").classList.add("flex");
        $("login-view").classList.add("hidden");
        $("login-view").classList.remove("flex");
      }

      // ---------- Boot ----------
      async function boot() {
        const cfg = await fetch("/api/config").then((r) => r.json());
        renderUserList(cfg.users);

        try {
          const me = await fetch("/api/me").then((r) => {
            if (!r.ok) throw new Error();
            return r.json();
          });
          enterChat(me);
        } catch {
          showLogin();
        }
      }

      function renderUserList(users) {
        // Reference only — shows each account and its document access. Users sign
        // in by typing an email and password above (not by clicking a row).
        $("user-list").innerHTML = users
          .map(
            (u) => `
          <div
            class="rounded-xl border border-ink-600 bg-ink-700/50 px-3 py-2">
            <div class="text-sm font-medium text-white">${u.email}</div>
            <div class="text-xs text-slate-400">${u.companies.join(" · ") || "no access"}</div>
          </div>`
          )
          .join("");
      }

      // ---------- Auth ----------
      async function login(email, password) {
        $("login-error").classList.add("hidden");
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          $("login-error").textContent = err.error || "Login failed";
          $("login-error").classList.remove("hidden");
          return;
        }
        enterChat(await res.json());
      }

      $("login-form").addEventListener("submit", (e) => {
        e.preventDefault();
        login($("email-input").value.trim(), $("password-input").value);
      });

      $("logout-btn").addEventListener("click", async () => {
        await fetch("/api/logout", { method: "POST" });
        state.me = null;
        $("messages").innerHTML = "";
        showLogin();
      });

      $("clear-btn").addEventListener("click", async () => {
        await fetch("/api/reset", { method: "POST" });
        $("messages").innerHTML = "";
        addWelcome();
      });

      // ---------- Chat setup ----------
      function enterChat(me) {
        state.me = me;
        $("who").textContent = me.display_name;
        $("who-email").textContent = me.email;
        $("company-pills").innerHTML = me.companies
          .map(
            (c) =>
              `<span class="rounded-full bg-brand-600/30 px-2.5 py-1 text-xs text-brand-400">${c}</span>`
          )
          .join("");
        const first = me.companies[0] || "your company";
        const suggestions = [
          `What was ${first}'s revenue in Q4?`,
          `What guidance did ${first} give for next year?`,
          `And the operating margin?`,
        ];
        $("suggestions").innerHTML = suggestions
          .map(
            (s) =>
              `<button class="suggestion block w-full rounded-lg px-2 py-1.5 text-left text-xs text-slate-300 hover:bg-ink-700">${s}</button>`
          )
          .join("");
        document.querySelectorAll(".suggestion").forEach((b) =>
          b.addEventListener("click", () => {
            $("question").value = b.textContent;
            $("question").focus();
          })
        );
        $("messages").innerHTML = "";
        addWelcome();
        showChat();
        $("question").focus();
      }

      function addWelcome() {
        const c = state.me.companies.join(", ") || "your documents";
        addBotBubble(
          `👋 Hi **${state.me.display_name}**! Ask me anything about **${c}** — revenue, guidance, margins, segments. I keep context for follow-ups, and I only ever use documents you're authorised to see.`
        ).el.classList.add("opacity-90");
      }

      // ---------- Message rendering ----------
      function addUserBubble(text) {
        const wrap = document.createElement("div");
        wrap.className = "flex justify-end";
        wrap.innerHTML = `<div class="max-w-[80%] rounded-2xl rounded-br-md bg-brand-600 px-4 py-2.5 text-sm text-white whitespace-pre-wrap">${escapeHtml(
          text
        )}</div>`;
        $("messages").appendChild(wrap);
        scrollDown();
      }

      function addBotBubble(md) {
        const wrap = document.createElement("div");
        wrap.className = "flex justify-start";
        const bubble = document.createElement("div");
        bubble.className =
          "md max-w-[82%] rounded-2xl rounded-bl-md border border-ink-600 bg-ink-700/60 px-4 py-2.5 text-sm leading-relaxed text-slate-100";
        bubble.innerHTML = render(md);
        wrap.appendChild(bubble);
        $("messages").appendChild(wrap);
        scrollDown();
        return { el: bubble, wrap };
      }

      function typingBubble() {
        const wrap = document.createElement("div");
        wrap.className = "flex justify-start";
        wrap.innerHTML = `<div class="rounded-2xl rounded-bl-md border border-ink-600 bg-ink-700/60 px-4 py-3">
          <span class="dot inline-block h-1.5 w-1.5 rounded-full bg-slate-400"></span>
          <span class="dot inline-block h-1.5 w-1.5 rounded-full bg-slate-400"></span>
          <span class="dot inline-block h-1.5 w-1.5 rounded-full bg-slate-400"></span>
        </div>`;
        $("messages").appendChild(wrap);
        scrollDown();
        return wrap;
      }

      function renderCitations(bubble, citations) {
        if (!citations || !citations.length) return;
        const details = document.createElement("details");
        details.open = true;
        details.className = "mt-3 border-t border-dashed border-ink-500 pt-2";
        details.innerHTML =
          `<summary class="cursor-pointer text-xs text-slate-400">Sources (${citations.length})</summary>` +
          citations
            .map(
              (c) => `
          <div class="mt-2 rounded-lg border-l-2 border-brand-500 bg-ink-800/70 px-3 py-2">
            <div class="flex justify-between gap-2 text-xs font-semibold text-slate-200">
              <span>${escapeHtml(c.label)}</span>
              <span class="font-normal text-slate-500">score ${c.score}</span>
            </div>
            <div class="mt-1 text-xs text-slate-400">${escapeHtml(c.excerpt)}</div>
          </div>`
            )
            .join("");
        bubble.appendChild(details);
        scrollDown();
      }

      // ---------- Streaming ----------
      async function ask(question) {
        if (state.streaming || !question) return;
        setStreaming(true);
        addUserBubble(question);
        const typing = typingBubble();

        state.controller = new AbortController();
        let bubble = null;
        let full = "";
        let stopped = false;
        try {
          const res = await fetch("/api/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question }),
            signal: state.controller.signal,
          });
          if (!res.ok || !res.body) {
            typing.remove();
            addBotBubble("⚠️ Sorry, something went wrong. Please try again.");
            return;
          }

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            // Parse complete SSE events (separated by a blank line).
            let sep;
            while ((sep = buffer.indexOf("\n\n")) !== -1) {
              const raw = buffer.slice(0, sep);
              buffer = buffer.slice(sep + 2);
              const evt = parseSSE(raw);
              if (!evt) continue;

              if (evt.event === "token") {
                if (!bubble) {
                  typing.remove();
                  bubble = addBotBubble("");
                }
                full += evt.data.text;
                bubble.el.innerHTML = render(full);
                bubble.el.classList.add("cursor");
                scrollDown();
              } else if (evt.event === "done") {
                if (!bubble) {
                  typing.remove();
                  bubble = addBotBubble(full || "");
                }
                bubble.el.classList.remove("cursor");
                bubble.el.innerHTML = render(full);
                highlightIn(bubble.el);
                renderCitations(bubble.el, evt.data.citations);
              } else if (evt.event === "error") {
                typing.remove();
                addBotBubble("⚠️ " + (evt.data.message || "Server error"));
              }
            }
          }
        } catch (e) {
          if (e.name === "AbortError") {
            stopped = true;
          } else {
            typing.remove();
            addBotBubble("⚠️ Connection error: " + e.message);
          }
        } finally {
          if (stopped) {
            typing.remove();
            if (bubble) {
              bubble.el.classList.remove("cursor");
              bubble.el.innerHTML = render(full);
              highlightIn(bubble.el);
              const note = document.createElement("div");
              note.className = "mt-2 text-xs italic text-slate-500";
              note.textContent = "⏹ Stopped";
              bubble.el.appendChild(note);
            } else {
              addBotBubble("_⏹ Stopped before any response._");
            }
          }
          state.controller = null;
          setStreaming(false);
          $("question").focus();
        }
      }

      function stopGenerating() {
        if (state.controller) state.controller.abort();
      }

      function parseSSE(raw) {
        let event = "message";
        let data = "";
        for (const line of raw.split("\n")) {
          if (line.startsWith("event:")) event = line.slice(6).trim();
          else if (line.startsWith("data:")) data += line.slice(5).trim();
        }
        if (!data) return null;
        try {
          return { event, data: JSON.parse(data) };
        } catch {
          return null;
        }
      }

      // ---------- Composer ----------
      const ta = $("question");
      ta.addEventListener("input", () => {
        ta.style.height = "auto";
        ta.style.height = Math.min(ta.scrollHeight, 160) + "px";
      });
      ta.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          submit();
        }
      });
      $("composer").addEventListener("submit", (e) => {
        e.preventDefault();
        submit();
      });
      function submit() {
        // While streaming, the primary button acts as a Stop control.
        if (state.streaming) {
          stopGenerating();
          return;
        }
        const q = ta.value.trim();
        if (!q) return;
        ta.value = "";
        ta.style.height = "auto";
        ask(q);
      }

      function setStreaming(on) {
        state.streaming = on;
        const btn = $("send-btn");
        ta.disabled = on;
        btn.disabled = false; // stays clickable so it can Stop
        if (on) {
          btn.innerHTML = STOP_ICON;
          btn.style.background = "#e11d48"; // rose-600 (overrides gradient)
          btn.title = "Stop generating";
        } else {
          btn.innerHTML = SEND_ICON;
          btn.style.background = ""; // restore gradient classes
          btn.title = "Send";
        }
      }

      // ---------- Utils ----------
      function scrollDown() {
        const m = $("messages");
        m.scrollTop = m.scrollHeight;
      }
      function escapeHtml(s) {
        return s.replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c]
        );
      }

      boot();
    </script>
  </body>
</html>
